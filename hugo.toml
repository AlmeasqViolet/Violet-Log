baseURL = "https://almeasqviolet.github.io/Violet-Log/"
languageCode = 'en'
title = "Violet's Log"
theme = 'hugo-theme-reimu'

defaultContentLanguage = 'en'
[languages]
[languages.en]
languageName = 'English'
weight = 1
#[languages.zh-CN]
#languageName = '简体中文'
#weight = 1
#hasCJKLanguage = true
#[languages.zh-TW]
#languageName = '繁體中文'
#weight = 1
#hasCJKLanguage = true
#[languages.ja]
#languageName = '日本語'
#weight = 1
hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
guessSyntax = true
noClasses = false

# 顺序有意义：Hugo 的 .Permalink 取的是排在第一位的 output format。
# 首页的 RSS 模板里 <channel><link> 用的就是它，必须落在 HTML 上，
# 否则 feed 里的站点地址会变成 /algolia.json，RSS 阅读器拿它去发现站点图标会全部失败
# （Thunderbird 于是只显示默认图标）。
[outputs]
home = ["HTML", "Algolia", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[markup.goldmark.renderer]
unsafe = true
